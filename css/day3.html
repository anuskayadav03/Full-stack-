<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Form</title>
  <link rel="stylesheet" href="day3.css">
</head>
<body>

  <div class="container">
    <!-- Title -->
    <h1 id="title">Student Feedback Survey</h1>

    <!-- Description -->
    <p id="description">Please fill out this survey to help us improve your learning experience.</p>

    <!-- Form -->
    <form id="survey-form">

      <!-- Name -->
      <label id="name-label" for="name">Full Name</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        placeholder="Enter your full name" 
        required
      >

      <!-- Email -->
      <label id="email-label" for="email">Email Address</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="Enter your email" 
        required
      >

      <!-- Number -->
      <label id="number-label" for="number">Age</label>
      <input 
        type="number" 
        id="number" 
        name="age" 
        min="10" 
        max="100" 
        placeholder="Enter your age"
      >

      <!-- Dropdown -->
      <label for="dropdown">Select your current level</label>
      <select id="dropdown" name="level">
        <option value="">Select an option</option>
        <option value="school">School</option>
        <option value="college">College</option>
      </select>

      <!-- Radio Buttons -->
      <label>How satisfied are you with your studies?</label>
      <div class="options">
        <input type="radio" name="satisfaction" value="good" class="inline"> Good
        <input type="radio" name="satisfaction" value="average" class="inline"> Average
      </div>

      <!-- Checkboxes -->
      <label>Which subjects do you like?</label>
      <div class="options">
        <input type="checkbox" value="math" class="inline"> Math
        <input type="checkbox" value="science" class="inline"> Science
        <input type="checkbox" value="english" class="inline"> English
      </div>

      <!-- Textarea -->
      <label for="comments">Additional Comments</label>
      <textarea id="comments" placeholder="Write your feedback here..."></textarea>

      <!-- Submit -->
      <button id="submit" type="submit">Submit</button>

    </form>
  </div>

</body>
</html>
